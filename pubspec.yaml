name: notetask
description: "Notes App - CPMAD database task (Floor + SQLite)."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.13.4

dependencies:
  flutter:
    sdk: flutter

  # Database (Floor abstraction over SQLite)
  floor: ^1.5.0
  path: ^1.9.1
  sqflite: ^2.4.4

  # Optional location attached to a note
  geolocator: ^14.1.1

  # Shake to delete all notes (accelerometer based shake detection)
  sensors_plus: ^7.1.1
  geocoding: ^5.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  build_runner: ^2.4.13
  floor_generator: ^1.5.0
  # Lets the unit tests run the real SQLite engine on the desktop test VM.
  sqflite_common_ffi: ^2.4.3

flutter:
  uses-material-design: true
